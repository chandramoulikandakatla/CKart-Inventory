name: CampusKart CI/CD Pipeline

on:
  push:
    branches: [main, master, core/application]
  pull_request:
    branches: [main, master, core/application]

jobs:
  backend-checks:
    name: Backend Test & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        run: npm --prefix backend install

      - name: Execute Backend Integration Suite
        run: npx tsx backend/test_backend.ts

      - name: Execute Backend Caching & Optimizations Suite
        run: npx tsx backend/test_optimizations.ts

  frontend-e2e:
    name: Frontend Build & Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm --prefix frontend install

      - name: TypeScript & Vite Production Build
        run: npm --prefix frontend run build

      - name: Run Guardian-Student Multi-Tenant Isolation Suite
        run: npx tsx frontend/test_parent_student_isolation.ts

      - name: Run Ecosystem Comprehensive Workflow Suite
        run: npx tsx frontend/test_ecosystem_audit.ts

      - name: Install Playwright Browsers & OS Dependencies
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Execute Playwright Headless E2E Tests
        run: npm --prefix frontend run test:e2e

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
